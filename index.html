<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Film 1900 Layer – Live Demo | Old Film Effect WebGL</title>
  <meta name="description" content="Live demo of Film 1900 Layer — zero-dependency WebGL2 silent-film / vintage film grain, scratches, dust and flicker effect for HTML5 video." />
  <style>
    :root {
      --bg: #0a0a0a;
      --accent: #c9a227;
      --text: #e8e0d0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    h1 {
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 0.5rem;
      font-size: 1.4rem;
    }
    p.sub {
      opacity: 0.7;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    .stage {
      position: relative;
      width: min(960px, 100%);
      aspect-ratio: 16/9;
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(201, 162, 39, 0.08);
    }
    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    video { opacity: 0; pointer-events: none; }
    .controls {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
      max-width: 960px;
      width: 100%;
      justify-content: center;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.85;
    }
    input[type="range"] {
      width: 140px;
      accent-color: var(--accent);
    }
    .btn-row {
      margin-top: 1.2rem;
      display: flex;
      gap: 0.8rem;
    }
    button {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.5rem 1.2rem;
      border-radius: 2px;
      cursor: pointer;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      transition: background 0.2s, color 0.2s;
    }
    button:hover {
      background: var(--accent);
      color: #111;
    }
    button.active {
      background: var(--accent);
      color: #111;
    }
    .note {
      margin-top: 2rem;
      font-size: 0.8rem;
      opacity: 0.55;
      max-width: 640px;
      text-align: center;
      line-height: 1.5;
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <h1>FILM 1900 LAYER</h1>
  <p class="sub">Pure WebGL · Zero dependency · Real-time preview + export ready</p>

  <div class="stage">
    <video id="src" crossorigin="anonymous" playsinline loop muted
           src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"></video>
    <canvas id="out"></canvas>
  </div>

  <div class="controls">
    <label>Sepia <input type="range" id="sepia" min="0" max="1" step="0.01" value="0.72"></label>
    <label>Grain <input type="range" id="grain" min="0" max="1" step="0.01" value="0.42"></label>
    <label>Scratches <input type="range" id="scratches" min="0" max="1" step="0.01" value="0.48"></label>
    <label>Dust <input type="range" id="dust" min="0" max="1" step="0.01" value="0.28"></label>
    <label>Flicker <input type="range" id="flicker" min="0" max="1" step="0.01" value="0.22"></label>
    <label>Vignette <input type="range" id="vignette" min="0" max="1" step="0.01" value="0.38"></label>
    <label>Intensity <input type="range" id="intensity" min="0" max="1" step="0.01" value="1"></label>
  </div>

  <div class="btn-row">
    <button id="play">Play</button>
    <button id="mono">Monochrome</button>
    <button id="export">Export Sample (5s)</button>
  </div>

  <p class="note">
    Live demo of <a href="https://github.com/Jmaity434/film-1900-layer">Film 1900 Layer</a>.<br>
    Use any CORS-enabled video. Same layer powers preview and export via captureStream.
  </p>

  <script type="module">
    import { Film1900Layer } from './src/film1900.js';

    const video = document.getElementById('src');
    const canvas = document.getElementById('out');

    const layer = new Film1900Layer({
      video,
      canvas,
      sepia: 0.72,
      grain: 0.42,
      scratches: 0.48,
      dust: 0.28,
      flicker: 0.22,
      vignette: 0.38,
      intensity: 1.0,
      monochrome: false,
    });

    layer.start();

    ['sepia','grain','scratches','dust','flicker','vignette','intensity'].forEach(id => {
      document.getElementById(id).addEventListener('input', e => {
        layer.setOptions({ [id]: parseFloat(e.target.value) });
      });
    });

    document.getElementById('play').addEventListener('click', () => {
      if (video.paused) {
        video.play();
        document.getElementById('play').textContent = 'Pause';
      } else {
        video.pause();
        document.getElementById('play').textContent = 'Play';
      }
    });

    let mono = false;
    document.getElementById('mono').addEventListener('click', () => {
      mono = !mono;
      layer.setOptions({ monochrome: mono });
      document.getElementById('mono').classList.toggle('active', mono);
    });

    document.getElementById('export').addEventListener('click', async () => {
      const btn = document.getElementById('export');
      btn.disabled = true;
      btn.textContent = 'Recording…';

      const stream = layer.captureStream(24);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
      const chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'film-1900-sample.webm';
        a.click();
        btn.disabled = false;
        btn.textContent = 'Export Sample (5s)';
      };
      recorder.start();
      setTimeout(() => recorder.stop(), 5000);
    });

    video.play().catch(() => {});
  </script>
</body>
</html>
